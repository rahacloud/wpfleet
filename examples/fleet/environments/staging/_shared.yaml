# Values every site in staging shares: <site>-staging.example.com.
domainSuffix: example.com
hostLabelSuffix: -staging

database:
  host: mariadb

ingress:
  className: nginx
  tls:
    clusterIssuer: letsencrypt

backup:
  enabled: true
  s3:
    endpoint: https://s3.example.com
    bucket: wordpress-backups
    secretName: backup-s3
