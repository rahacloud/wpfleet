# The site "blog" in development. The file name is the site name.
site: blog

# No image yet, so the site runs the official WordPress image that the chart
# names. `wpfleet build --set` adds an image block to this file in
# development, and `wpfleet promote` copies it from there into staging.

# EXAMPLE ONLY: the password and salts below are placeholders, not secrets.
# Generate real ones for every site and every environment, and keep the fleet
# repository private. The password must be at least 16 letters and digits.
database:
  password: ExampleOnlyNotASecretDevelopment1

salts:
  authKey: example-only-not-a-secret-auth-key-development
  secureAuthKey: example-only-not-a-secret-secure-auth-key-development
  loggedInKey: example-only-not-a-secret-logged-in-key-development
  nonceKey: example-only-not-a-secret-nonce-key-development
  authSalt: example-only-not-a-secret-auth-salt-development
  secureAuthSalt: example-only-not-a-secret-secure-auth-salt-development
  loggedInSalt: example-only-not-a-secret-logged-in-salt-development
  nonceSalt: example-only-not-a-secret-nonce-salt-development
