apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wordpress.fullname" . }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
type: Opaque
stringData:
  WORDPRESS_DB_PASSWORD: {{ include "wordpress.dbPassword" . | quote }}
  {{- range $key, $env := dict "authKey" "AUTH_KEY" "secureAuthKey" "SECURE_AUTH_KEY" "loggedInKey" "LOGGED_IN_KEY" "nonceKey" "NONCE_KEY" "authSalt" "AUTH_SALT" "secureAuthSalt" "SECURE_AUTH_SALT" "loggedInSalt" "LOGGED_IN_SALT" "nonceSalt" "NONCE_SALT" }}
  WORDPRESS_{{ $env }}: {{ required (printf "salts.%s is required" $key) (index $.Values.salts $key) | quote }}
  {{- end }}
