name: Feature request
description: A new command, flag or behaviour for wpfleet.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        docs/design.md is the contract the commands are built against. A feature that changes it is easier to agree on here, before the code.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do with your fleet, and why wpfleet makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The command, flag or behaviour you want, with an example of how you would run it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including what you do today without wpfleet.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to send a pull request for this.
