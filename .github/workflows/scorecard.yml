name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"
  # The Branch-Protection check reads the rules, so rerun when they change.
  branch_protection_rule:

# No concurrency group or other top-level keys: api.scorecard.dev verifies the
# workflow before it accepts published results and keeps that shape strict.
permissions: {}

jobs:
  analysis:
    name: OpenSSF Scorecard
    # Scorecard publishes only for public repositories and code scanning on a
    # private one needs GitHub Advanced Security; it starts once wpfleet is
    # public, like CodeQL.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results signs the results with OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing feeds api.scorecard.dev and the README badge.
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
          category: scorecard
