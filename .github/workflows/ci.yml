name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  chart:
    name: helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/wordpress -f charts/wordpress/ci/test-values.yaml
      - run: helm lint deployments/helm/wpfleet -f deployments/helm/wpfleet/ci/test-values.yaml

  test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The one-time login plugin's test runs the real PHP and skips without it.
      - run: php --version
      - run: go build ./...
      - run: go test -race ./... -covermode=atomic -coverprofile=coverage.out
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      # The templ components are formatted and their generated Go is
      # committed; both must match what just generate writes.
      - run: go tool templ fmt -fail internal/infra/web/ui && go tool templ generate && git diff --exit-code

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Builds the server image to keep the Dockerfile working; nothing is
      # pushed until there is a release to push.
      - run: docker build -f build/package/Dockerfile -t wpfleet:ci .
      - run: docker run --rm wpfleet:ci --version
