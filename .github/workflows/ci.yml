name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    # Above golangci-lint's own --timeout, so a slow run fails with the
    # linter's message rather than being cut off by the runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # A fixed version, so a new linter that `default: all` turns on cannot
      # fail CI without a commit. Dependabot does not move this input: bump
      # it by hand, with the code it then asks for, as the other tool pins
      # in security.yml and the release workflows.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=15m

  chart:
    name: helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: helm lint charts/wordpress -f charts/wordpress/ci/test-values.yaml
      - run: helm lint deployments/helm/wpfleet -f deployments/helm/wpfleet/ci/test-values.yaml

  test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The one-time login plugin's test runs the real PHP and skips without it.
      - run: php --version
      - run: go build ./...
      - run: go test -race ./... -covermode=atomic -coverprofile=coverage.out
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      # The templ components are formatted and their generated Go is
      # committed; both must match what just generate writes.
      - run: go tool templ fmt -fail internal/infra/web/ui && go tool templ generate && git diff --exit-code

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the server image to keep the Dockerfile working; nothing is
      # pushed until there is a release to push.
      # The version must be stamped, not devel: the context has no .git.
      - run: >-
          docker build -f build/package/Dockerfile
          --build-arg VERSION=ci-${GITHUB_SHA::7} --build-arg COMMIT=${GITHUB_SHA::7}
          -t wpfleet:ci .
      - run: docker run --rm wpfleet:ci --version | grep -F "rev ${GITHUB_SHA::7}"
