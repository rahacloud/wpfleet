name: Release

# A tag v* publishes a release: the binaries and their SBOMs on the GitHub
# release, the image ghcr.io/rahacloud/wpfleet, and the Helm charts in
# oci://ghcr.io/rahacloud/charts. Everything is signed with cosign keyless
# through GitHub OIDC and gets a build provenance attestation.
# docs/releasing.md says how to cut one and how to verify it.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: binaries and image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release and its assets
      packages: write # the image on ghcr.io
      id-token: write # cosign keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the previous tag
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing, never from a cache another run wrote
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Artifact attestations on a private repository need GitHub Enterprise
      # Cloud; they start with the first release after wpfleet is public.
      - name: Attest the archives, SBOMs and checksums
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Attest the image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/digests.txt

  charts:
    name: Helm charts
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # the charts on ghcr.io, and their attestations beside them
      id-token: write # cosign keyless signing and attestations
      attestations: write
    env:
      REGISTRY: ghcr.io/rahacloud/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          printf '%s' "$GITHUB_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin
      # Each chart's version is the tag without its v. The WordPress chart keeps
      # its appVersion, which is the WordPress version it defaults to; the
      # server chart's appVersion is the release, so it runs the image of the
      # same tag.
      - name: Package and push the charts
        id: push
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p .charts
          helm package charts/wordpress --version "$version" --destination .charts
          if [ -d deployments/helm/wpfleet ]; then
            helm package deployments/helm/wpfleet --version "$version" --app-version "$version" --destination .charts
          fi
          : > .charts/pushed.txt
          for chart in .charts/*.tgz; do
            name="$(basename "$chart" "-$version.tgz")"
            out="$(helm push "$chart" "oci://$REGISTRY" 2>&1)"
            printf '%s\n' "$out"
            digest="$(printf '%s\n' "$out" | sed -n 's/^Digest: *//p')"
            if [ -z "$digest" ]; then
              echo "::error::helm push printed no digest for $name"
              exit 1
            fi
            printf '%s %s\n' "$name" "$digest" >> .charts/pushed.txt
            printf '%s=%s\n' "$name" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Sign the charts
        run: |
          set -euo pipefail
          while read -r name digest; do
            cosign sign --yes "$REGISTRY/$name@$digest"
          done < .charts/pushed.txt
      # The subject is the chart's OCI manifest, so the attestation is pushed
      # next to it and `gh attestation verify oci://...` finds it.
      - name: Attest the WordPress chart
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/wordpress
          subject-digest: ${{ steps.push.outputs.wordpress }}
          push-to-registry: true
      - name: Attest the server chart
        if: ${{ !github.event.repository.private && steps.push.outputs.wpfleet != '' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/wpfleet
          subject-digest: ${{ steps.push.outputs.wpfleet }}
          push-to-registry: true
