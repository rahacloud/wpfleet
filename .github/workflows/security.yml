name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories land without a commit; a weekly run finds them.
    - cron: "0 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Run from the module cache at a fixed version instead of
      # golang/govulncheck-action, which installs govulncheck@latest.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The runner image ships shellcheck, so run: steps are checked too.
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      # actionlint checks only run: steps; the scripts under hack/ need their
      # own pass.
      - run: shellcheck hack/*.sh

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # upload-sarif reads the run's metadata
      security-events: write # upload-sarif, once the repository is public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Code scanning on a private repository needs GitHub Advanced Security.
      # Until the repository is public, zizmor prints its findings and fails
      # the job on them instead of uploading SARIF.
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: ${{ !github.event.repository.private }}
          # A fixed version, so a new audit cannot fail CI without a commit.
          version: 1.33.1
