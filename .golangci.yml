---
version: "2"
linters:
  default: all
  disable:
    # Deprecated names: with `default: all` the old linter runs beside its
    # replacement and reports everything twice.
    - exhaustruct
    - gomodguard
    - wsl
    # Keep the rest short. Each entry needs a one-line "why".
    - depguard # needs a curated allowlist; turn it on when one exists
    - gomodguard_v2 # same reason as depguard
    - tagliatelle # struct tags follow Helm's and Kubernetes' naming, not Go style
    - varnamelen # short receiver and loop names are idiomatic Go
    - wsl_v5 # whitespace rules produce more churn than signal
  settings:
    revive:
      # Without this, listing rules turns off every rule revive runs by
      # default (context-as-argument, error-strings and the others).
      enable-default-rules: true
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
        - name: package-comments
        - name: var-naming
    wrapcheck:
      # Errors from this module's own packages already carry their context.
      ignore-package-globs:
        - github.com/rahacloud/wpfleet/*
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
