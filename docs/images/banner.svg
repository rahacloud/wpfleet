<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">wpfleet</title>
  <desc id="desc">The wpfleet mark, the name wpfleet and the line: a fleet of WordPress sites on Kubernetes, run from one Git repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f5fbf"/>
      <stop offset="1" stop-color="#123b7a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>

  <!-- The mark: the favicon's three stacked sites, larger. -->
  <g transform="translate(80 80)">
    <rect width="160" height="160" rx="35" fill="#fff" fill-opacity=".12"/>
    <g fill="#fff">
      <rect x="30" y="35" width="100" height="25" rx="7.5"/>
      <rect x="30" y="67.5" width="100" height="25" rx="7.5" opacity=".8"/>
      <rect x="30" y="100" width="100" height="25" rx="7.5" opacity=".6"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" fill="#fff">
    <text x="288" y="168" font-size="84" font-weight="700" letter-spacing="-1.5">wpfleet</text>
    <text x="292" y="212" font-size="23" fill-opacity=".85">WordPress sites on Kubernetes, run from one Git repository</text>
  </g>

  <!-- A small fleet: three site cards, each online. -->
  <g transform="translate(1024 72)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#fff">
    <g>
      <rect width="176" height="48" rx="10" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".25"/>
      <circle cx="22" cy="24" r="6" fill="#3ddc84"/>
      <text x="40" y="29">blog</text>
      <text x="160" y="29" text-anchor="end" fill-opacity=".6">live</text>
    </g>
    <g transform="translate(0 64)">
      <rect width="176" height="48" rx="10" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".25"/>
      <circle cx="22" cy="24" r="6" fill="#3ddc84"/>
      <text x="40" y="29">shop</text>
      <text x="160" y="29" text-anchor="end" fill-opacity=".6">live</text>
    </g>
    <g transform="translate(0 128)">
      <rect width="176" height="48" rx="10" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".25"/>
      <circle cx="22" cy="24" r="6" fill="#3ddc84"/>
      <text x="40" y="29">docs</text>
      <text x="160" y="29" text-anchor="end" fill-opacity=".6">staging</text>
    </g>
  </g>
</svg>
