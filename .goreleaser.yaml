# GoReleaser configuration — https://goreleaser.com
version: 2

project_name: wpfleet

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && for s in bash zsh fish; do go run ./cmd/wpfleet completion "$s" > "completions/wpfleet.$s"; done'

builds:
  - id: wpfleet
    main: ./cmd/wpfleet
    binary: wpfleet
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Stamped the way the image is, so a release and its image print the
    # same --version; the version package prefers these over the build info.
    ldflags:
      - -s -w
      - -X github.com/rahacloud/wpfleet/internal/infra/version.version=v{{ .Version }}
      - -X github.com/rahacloud/wpfleet/internal/infra/version.commit={{ .ShortCommit }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
